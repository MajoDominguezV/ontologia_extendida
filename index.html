<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ontología ESMAS-ES+ 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --teal: #00796b; --teal-light: #e0f2f1; --teal-mid: #b2dfdb; --teal-dark: #004d40;
  --cyan: #00acc1; --cyan-light: #e0f7fa;
  --slate: #334155; --slate-mid: #64748b; --slate-light: #f1f5f9;
  --white: #ffffff; --border: #e2e8f0;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08); --shadow-md: 0 4px 16px rgba(0,0,0,.10);
  --radius: 12px; --radius-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #f8fafc; color: var(--slate); min-height: 100vh; }

.topbar {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 0 32px; height: 56px; display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm);
}
.topbar-logo { font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--teal); }
.topbar-sep { color: var(--border); }
.topbar-version {
  font-size: .72rem; font-weight: 600; color: var(--slate-mid);
  background: var(--slate-light); padding: 2px 8px; border-radius: 20px;
  letter-spacing: .05em; text-transform: uppercase;
}
.topbar-search {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  background: var(--slate-light); border: 1.5px solid var(--border);
  border-radius: 30px; padding: 6px 16px; min-width: 260px;
  transition: border-color .2s, box-shadow .2s;
}
.topbar-search:focus-within { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,172,193,.12); background: var(--white); }
.topbar-search input { border: none; background: transparent; outline: none; font-family: inherit; font-size: .9rem; color: var(--slate); width: 100%; }
.topbar-search input::placeholder { color: var(--slate-mid); }

.breadcrumb-bar { padding: 14px 32px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.bc-item { font-size: .82rem; color: var(--slate-mid); cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: color .15s, background .15s; }
.bc-item:hover { color: var(--teal); background: var(--teal-light); }
.bc-item.active { color: var(--slate); font-weight: 600; cursor: default; }
.bc-item.active:hover { background: transparent; }
.bc-sep { color: var(--border); font-size: .85rem; }

.section-header { padding: 20px 32px 8px; }
.section-title { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--slate); line-height: 1.2; }
.section-subtitle { font-size: .85rem; color: var(--slate-mid); margin-top: 4px; }
.section-meta { display: flex; gap: 20px; margin-top: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.meta-pill { font-size: .8rem; color: var(--slate-mid); }
.meta-pill strong { color: var(--slate); }
.section-label { padding: 16px 32px 8px; font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--slate-mid); }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 0 32px 48px; }

.card {
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  display: flex; flex-direction: column; gap: 8px;
  position: relative; overflow: hidden;
  transition: border-color .2s, box-shadow .2s, transform .15s;
}
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--teal-mid); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--teal), var(--cyan)); opacity: 0; transition: opacity .2s;
}
.card.clickable:hover::before { opacity: 1; }

.card-badge {
  font-size: .68rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--teal-dark); background: var(--teal-light); padding: 2px 8px;
  border-radius: 20px; width: fit-content;
}
.card-badge.world { color: #006064; background: var(--cyan-light); }
.card-title { font-family: 'DM Serif Display', serif; font-size: 1.15rem; color: var(--slate); line-height: 1.25; }
.card-count { font-size: .8rem; color: var(--slate-mid); }
.card-def { font-size: .83rem; color: var(--slate-mid); line-height: 1.5; }

.card-qa {
  background: var(--teal-light); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: .8rem; line-height: 1.5;
  border-left: 3px solid var(--teal); margin-top: 4px;
}
.card-qa .q { color: var(--teal-dark); margin-bottom: 4px; }
.card-qa .a { font-weight: 600; color: var(--teal); }
.card-qa .ej { font-size: .77rem; color: var(--slate-mid); margin-top: 3px; font-style: italic; }

.candidates-toggle {
  display: flex; align-items: center; gap: 6px;
  font-size: .78rem; font-weight: 500; color: var(--teal);
  background: none; border: 1px solid var(--teal-mid);
  border-radius: 20px; padding: 4px 12px; cursor: pointer;
  margin-top: 4px; width: fit-content; transition: background .15s;
  font-family: inherit;
}
.candidates-toggle:hover { background: var(--teal-light); }
.candidates-toggle .arrow { font-size: .65rem; transition: transform .2s; display: inline-block; }
.candidates-toggle.open .arrow { transform: rotate(90deg); }

.candidates-list {
  display: none; margin-top: 6px;
  background: var(--slate-light); border-radius: var(--radius-sm);
  padding: 8px 12px; max-height: 180px; overflow-y: auto;
}
.candidates-list.open { display: block; }
.candidates-list ul { list-style: none; }
.candidates-list li { font-size: .78rem; color: var(--slate); padding: 3px 0; border-bottom: 1px solid var(--border); }
.candidates-list li:last-child { border-bottom: none; }

.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .85rem; font-weight: 500; color: var(--teal);
  background: var(--teal-light); border: none; border-radius: 20px;
  padding: 6px 14px; cursor: pointer; margin: 16px 32px 0; transition: background .15s;
  font-family: inherit;
}
.back-btn:hover { background: var(--teal-mid); }

.search-results { padding: 0 32px 48px; display: flex; flex-direction: column; gap: 10px; }
.search-count { padding: 12px 32px 8px; font-size: .85rem; color: var(--slate-mid); }
.result-item { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 18px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.result-item:hover { border-color: var(--cyan); box-shadow: var(--shadow-sm); }
.result-label { font-weight: 600; color: var(--slate); font-size: .95rem; }
.result-path { font-size: .75rem; color: var(--slate-mid); margin-top: 3px; }
.result-qa { font-size: .8rem; color: var(--slate-mid); margin-top: 6px; }
.result-qa em { color: var(--teal); font-style: normal; font-weight: 500; }
mark { background: #fef08a; color: var(--slate); border-radius: 2px; padding: 0 1px; }

.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 40vh; gap: 16px; color: var(--slate-mid); }
.spinner { width: 36px; height: 36px; border: 3px solid var(--teal-mid); border-top-color: var(--teal); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { padding: 60px 32px; text-align: center; color: var(--slate-mid); }
.empty h3 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; margin-bottom: 8px; color: var(--slate); }
.fade-in { animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">Ontología ESMAS-ES+</span>
  <span class="topbar-sep">|</span>
  <span class="topbar-version">2.0</span>
  <div class="topbar-search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Buscar concepto..." autocomplete="off">
  </div>
</div>

<div id="app"><div class="loading"><div class="spinner"></div>Cargando ontología…</div></div>

<script>
let C = {}, stack = [], searchQuery = '';

const lbl  = c => c.l || c.id;
const def  = c => c.d || '';
const preg = c => c.p || '';
const resp = c => c.r || '';
const ejm  = c => c.e || '';

function getChildren(id) { return Object.values(C).filter(c => c.b === id); }

function countLeaves(id) {
  const ch = getChildren(id);
  return ch.length ? ch.reduce((s,c) => s + countLeaves(c.id), 0) : 1;
}
function countDesc(id) {
  const ch = getChildren(id);
  return ch.length ? ch.length + ch.reduce((s,c) => s + countDesc(c.id), 0) : 0;
}
function getLeafLabels(id) {
  const ch = getChildren(id);
  return ch.length ? ch.flatMap(c => getLeafLabels(c.id)) : [lbl(C[id])];
}
function getPath(id) {
  const p = []; let cur = C[id];
  while (cur) { p.unshift(cur); cur = cur.b ? C[cur.b] : null; }
  return p;
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hilite(s, q) {
  if (!q||!s) return esc(s||'');
  return esc(s).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
}

function render() {
  searchQuery.length >= 2 ? renderSearch() : renderLevel();
}

function renderLevel() {
  const app = document.getElementById('app');
  const cur = stack.length ? C[stack[stack.length-1].id] : null;
  const items = cur ? getChildren(cur.id) : Object.values(C).filter(c => !c.b);
  const total = Object.keys(C).length;
  const totalLeaves = cur ? countLeaves(cur.id) : Object.values(C).filter(c=>!getChildren(c.id).length).length;

  let bcHTML = `<span class="bc-item" onclick="goHome()">Ontología ESMAS-ES+</span>`;
  stack.forEach((s,i) => {
    bcHTML += `<span class="bc-sep">›</span>`;
    bcHTML += i < stack.length-1
      ? `<span class="bc-item" onclick="goTo(${i})">${esc(s.label)}</span>`
      : `<span class="bc-item active">${esc(s.label)}</span>`;
  });

  const title = cur ? lbl(cur) : 'Sistema Taxonómico ESMAS-ES+';
  const subtitle = cur ? def(cur) : 'Una arquitectura conceptual avanzada que organiza el conocimiento a través de siete mundos interconectados.';

  let cardsHTML = '';
  items.forEach(c => {
    const hasChildren = getChildren(c.id).length > 0;
    const leaves = hasChildren ? countLeaves(c.id) : 0;
    const desc   = hasChildren ? countDesc(c.id) : 0;
    const isWorld = !cur;

    const badge = `<span class="card-badge${isWorld?' world':''}">${isWorld?'Mundo':'Categoría'}</span>`;
    const countLine = hasChildren
      ? `<div class="card-count">${desc.toLocaleString()} conceptos · ${leaves.toLocaleString()} candidatos</div>`
      : `<div class="card-count">Término hoja</div>`;

    const defHTML = def(c) ? `<div class="card-def">${esc(def(c))}</div>` : '';

    const qaHTML = preg(c) ? `<div class="card-qa">
      <div class="q">P: ${esc(preg(c))}</div>
      ${resp(c)?`<div class="a">R: ${esc(resp(c))}</div>`:''}
      ${ejm(c)?`<div class="ej">Ej: ${esc(ejm(c))}</div>`:''}
    </div>` : '';

    let candidatesHTML = '';
    if (hasChildren) {
      const leafLabels = getLeafLabels(c.id);
      const uid = 'c_' + c.id.substring(0,20).replace(/\W/g,'_') + '_' + Math.random().toString(36).slice(2,6);
      candidatesHTML = `
        <button class="candidates-toggle" onclick="toggleCand(event,'${uid}')">
          <span class="arrow">▶</span> Candidatos en español (${leafLabels.length})
        </button>
        <div class="candidates-list" id="${uid}">
          <ul>${leafLabels.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
        </div>`;
    }

    cardsHTML += `<div class="card${hasChildren?' clickable':''}" ${hasChildren?`onclick="drill('${c.id}')"`:''}>${badge}<div class="card-title">${esc(lbl(c))}</div>${countLine}${defHTML}${qaHTML}${candidatesHTML}</div>`;
  });

  app.innerHTML = `
    <div class="breadcrumb-bar fade-in">${bcHTML}</div>
    ${stack.length?`<button class="back-btn" onclick="goBack()">← Volver</button>`:''}
    <div class="section-header fade-in">
      <div class="section-title">${esc(title)}</div>
      ${subtitle?`<div class="section-subtitle">${esc(subtitle)}</div>`:''}
      <div class="section-meta">
        <span class="meta-pill"><strong>${total.toLocaleString()}</strong> conceptos totales</span>
        <span class="meta-pill"><strong>${totalLeaves.toLocaleString()}</strong> candidatos en español</span>
        <span class="meta-pill">Profundidad: <strong>${stack.length}</strong></span>
        <span class="meta-pill"><strong>${items.length}</strong> ${cur?'subcategorías':'mundos'}</span>
      </div>
    </div>
    <div class="section-label">${esc(title)}</div>
    <div class="card-grid fade-in">${cardsHTML}</div>`;
}

function renderSearch() {
  const app = document.getElementById('app');
  const q = searchQuery.toLowerCase();
  const results = Object.values(C).filter(c =>
    (c.l||'').toLowerCase().includes(q)||(c.d||'').toLowerCase().includes(q)||
    (c.p||'').toLowerCase().includes(q)||(c.r||'').toLowerCase().includes(q)||(c.e||'').toLowerCase().includes(q)
  ).slice(0,80);

  let html = `<div class="search-count">${results.length} resultado${results.length!==1?'s':''} para "<strong>${esc(searchQuery)}</strong>"</div><div class="search-results fade-in">`;
  results.forEach(c => {
    const path = getPath(c.id).map(p=>lbl(p)).join(' › ');
    const hasChildren = getChildren(c.id).length > 0;
    html += `<div class="result-item" ${hasChildren?`onclick="drill('${c.id}')"`:''}>
      <div class="result-label">${hilite(lbl(c),searchQuery)}</div>
      <div class="result-path">${esc(path)}</div>
      ${preg(c)?`<div class="result-qa">P: ${hilite(preg(c),searchQuery)}${resp(c)?` — <em>R: ${hilite(resp(c),searchQuery)}</em>`:''}</div>`:''}
      ${ejm(c)?`<div class="result-qa" style="font-style:italic">${hilite(ejm(c),searchQuery)}</div>`:''}
    </div>`;
  });
  html += '</div>';
  if (!results.length) html = `<div class="empty"><h3>Sin resultados</h3><p>No hay conceptos que coincidan con "<strong>${esc(searchQuery)}</strong>".</p></div>`;
  app.innerHTML = html;
}

function drill(id) { const c=C[id]; if(!c) return; stack.push({id,label:lbl(c)}); render(); scrollTo(0,0); }
function goBack() { stack.pop(); render(); scrollTo(0,0); }
function goHome() { stack=[]; render(); scrollTo(0,0); }
function goTo(i) { stack=stack.slice(0,i+1); render(); scrollTo(0,0); }

function toggleCand(e, uid) {
  e.stopPropagation();
  e.currentTarget.classList.toggle('open');
  document.getElementById(uid).classList.toggle('open');
}

document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value.trim(); render();
});

fetch('ontologia.json')
  .then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(data => {
    Object.entries(data).forEach(([id,c]) => { c.id=id; });
    C = data; render();
  })
  .catch(() => {
    document.getElementById('app').innerHTML = `<div class="empty"><h3>No se pudo cargar la ontología</h3><p>Asegúrate de que <code>ontologia.json</code> está en la misma carpeta que <code>index.html</code>.</p></div>`;
  });
</script>
</body>
</html>
